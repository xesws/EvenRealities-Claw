# CI（M7）。四个 job 按"越贵越靠后"排，前面的失败不必等后面跑完。
#
# 一条原则：**不让测试悄悄跳过就算通过**。排版引擎的外部 oracle 需要 node 与
# plugin/node_modules/@evenrealities/pretext，缺了会整模块 skip —— 那样 CI 会绿，
# 而"我们的折行和官方一致"这个最关键的结论根本没被验证过。所以 gateway job
# 先装插件依赖，跑完再显式断言 oracle 没有 skip。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  units:
    name: 部署（systemd unit 语法）
    runs-on: ubuntu-latest
    # unit 写错的表现是**开机时静默失败**：systemd 记一行到 journal 就没了，
    # 而人只会在「重启之后眼镜连不上」时才发现，跟改坏的那一行隔着几天。
    # 这正是最难自己浮出来的那类错，也是 deploy/ 这块补丁本身要解决的问题。
    steps:
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        run: |
          set -euo pipefail
          systemd-analyze --version | head -1
          systemd-analyze --help | grep -q -- --recursive-errors \
            || { echo '❌ 这个 systemd 不认识 --recursive-errors（需要 v249+）'; exit 1; }

          # 先证明这条检查真的会红。「校验命令在这个环境里恒返回 0」和
          # gateway job 里那个「oracle 静默 skip」是同一类事故：CI 是绿的，
          # 而它声称验过的东西根本没被验过。所以拿一个必然非法的 unit 先喂一遍
          # —— [Service] 段没有任何 ExecStart，systemd 会直接拒绝加载。
          mkdir -p /tmp/canary
          printf '[Service]\nType=simple\n' > /tmp/canary/canary.service
          if systemd-analyze --user --recursive-errors=no verify /tmp/canary/canary.service
          then echo '❌ 连没有 ExecStart 的 unit 都通过了 —— 这条检查是摆设'; exit 1; fi
          echo '✓ 坏 unit 被拒，检查有效'

          # unit 用 %h 指向 venv 里的 python，而 verify 会真的去 stat ExecStart
          # 指向的文件（找不到是 error，不是 warning）。所以先在 $HOME 下摆一个
          # 同名的可执行文件 —— 这样验的是真实的路径拼装，而不是绕过这项检查。
          mkdir -p "$HOME/EvenRealities-Claw/gateway/.venv/bin"
          ln -sf "$(command -v python3)" "$HOME/EvenRealities-Claw/gateway/.venv/bin/python"
          # --user：这两个是**用户** unit（WantedBy=default.target，装到
          #   ~/.config/systemd/user/）。系统作用域下 %h 解析成 /root，验的是错路径。
          # --recursive-errors=no：只报被指定 unit 自己的错。lens-gateway 的
          #   After=lens-agent.service 在 CI 里没装，而 After= 本来就允许指向不存在
          #   的 unit（no-op）—— 不关掉的话，这里会因为一件完全正常的事变红。
          systemd-analyze --user --recursive-errors=no verify deploy/*.service
          echo '✓ deploy/*.service 通过'

  plugin:
    name: 插件（typecheck + vitest + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试（jsdom + 真 SDK + 存根传输层）
        run: npm test
      - name: 构建
        run: npm run build

  gateway:
    name: 网关（pytest + 排版外部 oracle）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: 装插件依赖（排版 oracle 要用 @evenrealities/pretext）
        run: npm ci
        working-directory: plugin
      - name: 装网关依赖
        run: pip install -r requirements-dev.txt
        working-directory: gateway
      - name: 单元测试
        run: PYTHONPATH=. pytest tests/ -q --junitxml=/tmp/pytest.xml
        working-directory: gateway
      - name: 断言外部 oracle 真的跑了（没有静默 skip）
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/pytest.xml').getroot()
          oracle = [tc for tc in root.iter('testcase')
                    if 'test_metrics_oracle' in (tc.get('classname') or '')]
          skipped = [tc for tc in oracle if tc.find('skipped') is not None]
          print(f'oracle 用例 {len(oracle)} 个，跳过 {len(skipped)} 个')
          if not oracle or skipped:
              print('❌ 排版外部 oracle 没有真的执行 —— 折行与官方 pretext 是否一致未经验证')
              sys.exit(1)
          PY

  e2e:
    name: 端到端（模拟链路 + MCP 四进程）
    runs-on: ubuntu-latest
    # 要下 whisper 模型（tiny+base ≈ 200MB），比单测慢一个量级，所以单独成 job
    needs: [gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - name: 缓存 whisper 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-tiny-base-v1
      - run: pip install -r requirements-dev.txt
        working-directory: gateway
      - name: 语音链路端到端（自带 agent 夹具，无外部依赖）
        run: PYTHONPATH=. python tests/e2e_sim.py
        working-directory: gateway
      - name: MCP 四进程真链路
        run: PYTHONPATH=. python tests/e2e_mcp.py
        working-directory: gateway

  # 真 agent 端到端（tests/e2e_agent.py）**故意不进 CI**：它会对 DeepSeek 发起真实
  # 付费调用，需要 LENS_LLM_API_KEY。放进 CI 等于让每个 PR 都花钱，且外部服务抖动
  # 会把构建结果变成噪音。它是发版前手动跑的验收项，证据记在 REPORT.md。
