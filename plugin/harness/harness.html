<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Lens · Browser Simulator</title>
    <style>
      :root {
        --bg: #0b0f0d;
        --panel: #131a16;
        --line: #243029;
        --fg: #e6f2ea;
        --dim: #8aa394;
        --green: #2bdc7e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      }
      .harness {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
        align-items: flex-start;
        justify-content: center;
      }
      .left { display: flex; flex-direction: column; gap: 14px; }
      h2 { margin: 0; font-size: 15px; color: var(--dim); font-weight: 600; }
      h2 b { color: var(--green); }

      /* the 576x288 display, scaled 1.5x for readability */
      .glasses-shell {
        width: 864px;
        height: 432px;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      .glasses-screen {
        position: absolute;
        left: 0;
        top: 0;
        width: 576px;
        height: 288px;
        transform: scale(1.5);
        transform-origin: top left;
        background: #000;
        color: #39ffa0;
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .controls button {
        font: inherit;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
      }
      .controls button:hover { border-color: var(--green); }
      .controls select, .controls input[type='number'] {
        font: inherit;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
      }
      .controls.fx { font-size: 13px; color: var(--dim); }
      .controls.fx label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
      .mic { font-size: 13px; color: var(--dim); }
      .mic em { color: var(--green); font-style: normal; }
      .log {
        width: 864px;
        height: 180px;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: 12px/1.6 'SF Mono', Menlo, Consolas, monospace;
        color: var(--dim);
        white-space: pre-wrap;
      }
      .log .t { color: #4d6457; }

      /* phone frame: the real plugin UI runs inside */
      .phone-frame {
        width: 400px;
        min-height: 720px;
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        background: var(--bg);
        box-shadow: 0 0 40px rgba(43, 220, 126, 0.06);
      }
      @media (max-width: 1320px) {
        .harness { justify-content: flex-start; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="harness">
      <div class="left">
        <h2><b>OpenClaw Lens</b> browser simulator &mdash; the real plugin plus a stand-in display; point it at a real gateway to exercise the whole chain</h2>
        <div class="glasses-shell">
          <div id="glassesScreen" class="glasses-screen"></div>
        </div>
        <div class="controls">
          <select id="gestureKind">
            <option value="tap">Tap (CLICK, eventType omitted)</option>
            <option value="doubleTap">Double tap (DOUBLE_CLICK=3)</option>
            <option value="swipeUp">Swipe up (SCROLL_TOP=1)</option>
            <option value="swipeDown">Swipe down (SCROLL_BOTTOM=2)</option>
            <option value="longPress">Long press (LONG_PRESS=9)</option>
            <option value="longPressRelease">Long press release (=10)</option>
          </select>
          <select id="gestureSource">
            <option value="glassesR">Right temple (1)</option>
            <option value="glassesL">Left temple (3)</option>
            <option value="ring">R1 ring (2)</option>
            <option value="unknown">Source omitted (0)</option>
          </select>
          <button id="btnGesture">Send gesture</button>
        </div>
        <div class="controls">
          <button id="btnFgEnter">Foreground enter (4)</button>
          <button id="btnFgExit">Foreground exit (5) · must not drop WS</button>
          <button id="btnExit">System exit (7)</button>
          <button id="btnAbnormal">Abnormal exit (6)</button>
          <button id="btnDrop">Drop WS</button>
          <button id="btnBattery">Push battery 12%</button>
          <button id="btnUnworn">Push not-worn</button>
          <button id="btnRing">Push R1 ring (41%) · must not count as glasses</button>
          <button id="btnStats">Dump stats / on-screen text</button>
        </div>
        <div class="controls fx">
          <span class="mic">Fault injection:</span>
          <label><input type="checkbox" id="fxUpgradeFail" />textContainerUpgrade always fails</label>
          <label><input type="checkbox" id="fxMicDenied" />Microphone taken by another app</label>
          <label><input type="checkbox" id="fxHang" />bridge hangs (exercise the 5s timeout)</label>
          <label>BLE delay <input type="number" id="fxDelay" value="0" min="0" step="50" style="width:70px" /> ms</label>
          <span class="mic">Mic: <em id="micState">off</em></span>
        </div>
        <div id="mockLog" class="log"></div>
      </div>
      <div class="phone-frame">
        <div id="app"></div>
      </div>
    </div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
