<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Lens · 浏览器模拟器</title>
    <style>
      :root {
        --bg: #0b0f0d;
        --panel: #131a16;
        --line: #243029;
        --fg: #e6f2ea;
        --dim: #8aa394;
        --green: #2bdc7e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      }
      .harness {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
        align-items: flex-start;
        justify-content: center;
      }
      .left { display: flex; flex-direction: column; gap: 14px; }
      h2 { margin: 0; font-size: 15px; color: var(--dim); font-weight: 600; }
      h2 b { color: var(--green); }

      /* 576×288 眼镜屏，等比放大 1.5x 显示 */
      .glasses-shell {
        width: 864px;
        height: 432px;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      .glasses-screen {
        position: absolute;
        left: 0;
        top: 0;
        width: 576px;
        height: 288px;
        transform: scale(1.5);
        transform-origin: top left;
        background: #000;
        color: #39ffa0;
        font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .controls button {
        font: inherit;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
      }
      .controls button:hover { border-color: var(--green); }
      .controls select, .controls input[type='number'] {
        font: inherit;
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
      }
      .controls.fx { font-size: 13px; color: var(--dim); }
      .controls.fx label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
      .mic { font-size: 13px; color: var(--dim); }
      .mic em { color: var(--green); font-style: normal; }
      .log {
        width: 864px;
        height: 180px;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: 12px/1.6 'SF Mono', Menlo, Consolas, monospace;
        color: var(--dim);
        white-space: pre-wrap;
      }
      .log .t { color: #4d6457; }

      /* 手机框：插件 UI 原样跑在里面 */
      .phone-frame {
        width: 400px;
        min-height: 720px;
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        background: var(--bg);
        box-shadow: 0 0 40px rgba(43, 220, 126, 0.06);
      }
      @media (max-width: 1320px) {
        .harness { justify-content: flex-start; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="harness">
      <div class="left">
        <h2><b>OpenClaw Lens</b> 浏览器模拟器 —— 完整插件 + 假眼镜，连真网关即可全链路验证</h2>
        <div class="glasses-shell">
          <div id="glassesScreen" class="glasses-screen"></div>
        </div>
        <div class="controls">
          <select id="gestureKind">
            <option value="tap">单击（CLICK，eventType 缺省）</option>
            <option value="doubleTap">双击（DOUBLE_CLICK=3）</option>
            <option value="swipeUp">上滑（SCROLL_TOP=1）</option>
            <option value="swipeDown">下滑（SCROLL_BOTTOM=2）</option>
            <option value="longPress">长按（LONG_PRESS=9）</option>
            <option value="longPressRelease">长按松开（=10）</option>
          </select>
          <select id="gestureSource">
            <option value="glassesR">右镜腿（1）</option>
            <option value="glassesL">左镜腿（3）</option>
            <option value="ring">R1 戒指（2）</option>
            <option value="unknown">来源缺省（0，字段省略）</option>
          </select>
          <button id="btnGesture">发送手势</button>
        </div>
        <div class="controls">
          <button id="btnFgEnter">前台进入(4)</button>
          <button id="btnFgExit">前台退出(5) · 不该断 WS</button>
          <button id="btnExit">系统退出(7)</button>
          <button id="btnAbnormal">异常退出(6)</button>
          <button id="btnDrop">断网（关 WS）</button>
          <button id="btnBattery">推低电量 12%</button>
          <button id="btnUnworn">推未佩戴</button>
          <button id="btnStats">打印统计/屏上文本</button>
        </div>
        <div class="controls fx">
          <span class="mic">故障注入：</span>
          <label><input type="checkbox" id="fxUpgradeFail" />textContainerUpgrade 恒失败</label>
          <label><input type="checkbox" id="fxMicDenied" />麦克风被抢占</label>
          <label><input type="checkbox" id="fxHang" />bridge 卡死（测 5s 超时）</label>
          <label>BLE 延迟 <input type="number" id="fxDelay" value="0" min="0" step="50" style="width:70px" /> ms</label>
          <span class="mic">麦克风：<em id="micState">关闭</em></span>
        </div>
        <div id="mockLog" class="log"></div>
      </div>
      <div class="phone-frame">
        <div id="app"></div>
      </div>
    </div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
